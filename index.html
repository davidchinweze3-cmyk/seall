async function pagesPdf(files,clean,name){if(!files.length)return toast('Add a page first');toast('Building PDF...');try{await loadJS(JSPDF);const{jsPDF}=window.jspdf,p=new jsPDF('p','pt','a4'),W=p.internal.pageSize.getWidth(),H=p.internal.pageSize.getHeight();for(let i=0;i<files.length;i++){const c=await enhC(files[i],clean),s=Math.min((W-30)/c.width,(H-30)/c.height),w=c.width*s,h=c.height*s;if(i)p.addPage();p.addImage(c.toDataURL('image/jpeg',.9),'JPEG',(W-w)/2,(H-h)/2,w,h)}dl(p.output('blob'),name)}catch(e){toast('Could not make the PDF. Check your connection.')}}
async function enhC(f,clean){const i=await ldImg(await imgData(f,1600)),c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);if(clean){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let q=0;q<p.length;q+=4){const g=.3*p[q]+.59*p[q+1]+.11*p[q+2],v=(g-120)*1.5+135;p[q]=p[q+1]=p[q+2]=v}x.putImageData(d,0,0)}return c}

async function pdfOut(sel){if(!PG.length)return toast('Add a PDF first');try{await loadJS(PDFL);const L=PDFLib,out=await L.PDFDocument.create(),docs={},font=await out.embedFont(L.StandardFonts.Helvetica);for(const i of (sel||PG.map((_,i)=>i))){const g=PG[i];if(!g)continue;const src=docs[g.f]||(docs[g.f]=await L.PDFDocument.load(PF[g.f].b,{ignoreEncryption:true})),[pg]=await out.copyPages(src,[g.p]);if(g.r)pg.setRotation(L.degrees((pg.getRotation().angle+g.r)%360));out.addPage(pg);const{width:W,height:H}=pg.getSize();for(const o of g.ov){const ps={tl:[30,H-60],tr:[W-200,H-60],bl:[30,40],br:[W-200,40],c:[W/2-80,H/2]}[o.pos]||[30,40];if(o.t=='text')pg.drawText(o.v,{x:ps[0],y:ps[1],size:14,font,color:L.rgb(0,0,0)});else{const im=await out.embedPng(o.v),w=o.t=='stamp'?110:130;pg.drawImage(im,{x:ps[0],y:ps[1],width:w,height:im.height*w/im.width})}}}dl(new Blob([await out.save()],{type:'application/pdf'}),'sealup.pdf')}catch(e){toast('Could not build the PDF')}}

async function imgDraw(){const cv=document.getElementById('iec');if(!cv||!IE.i)return;const i=IE.i,r=IE.rot%180?1:0,sw=r?i.height:i.width,sh=r?i.width:i.height,t=document.createElement('canvas');t.width=sw;t.height=sh;const x=t.getContext('2d');x.translate(sw/2,sh/2);x.rotate(IE.rot*Math.PI/180);x.drawImage(i,-i.width/2,-i.height/2);const ra=IE.ratio||sw/sh;let cw=sw,ch=cw/ra;if(ch>sh){ch=sh;cw=ch*ra}cw=Math.round(cw*IE.zoom/100);ch=Math.round(ch*IE.zoom/100);const cx=(sw-cw)*IE.ox/100,cy=(sh-ch)*IE.oy/100;cv.width=cw;cv.height=ch;const c=cv.getContext('2d');c.drawImage(t,cx,cy,cw,ch,0,0,cw,ch);if(IE.br||IE.ct||IE.gr){const d=c.getImageData(0,0,cw,ch),p=d.data,k=1+IE.ct/100,b=IE.br*2.55;for(let q=0;q<p.length;q+=4){let R=p[q],G=p[q+1],B=p[q+2];if(IE.gr){R=G=B=.3*R+.59*G+.11*B}p[q]=(R-128)*k+128+b;p[q+1]=(G-128)*k+128+b;p[q+2]=(B-128)*k+128+b}c.putImageData(d,0,0)}const src=IE.ov<0?null:((IE.ovk=='sig'?S.sigs:S.stamps)||[])[IE.ov];if(src){const o=await ldImg(src),w=cw*IE.sz/100,h=o.height*w/o.width,m=cw*.04,ps={tl:[m,m],tr:[cw-w-m,m],bl:[m,ch-h-m],br:[cw-w-m,ch-h-m],c:[(cw-w)/2,(ch-h)/2]}[IE.pos];c.drawImage(o,ps[0],ps[1],w,h)}}
